name: ivucx-proof-executor

on:
  workflow_dispatch:
    inputs:
      plan_id:
        description: Supabase helper_conversion_plans.id
        required: true
        type: string
      helper_job_id:
        description: Supabase helper_jobs.id
        required: true
        type: string
      operation:
        description: check / convert / submit
        required: true
        type: string
      helper_base_url:
        description: Public base URL of the helper API
        required: true
        type: string
      helper_access_token:
        description: One-time token used to fetch plan data and post the callback
        required: false
        type: string
      request_id:
        description: Optional request id for traceability
        required: false
        type: string
      enable_lean_cic:
        description: Enable Lean cic-v1 exporter setup
        required: false
        type: string
      enable_coq_cic:
        description: Enable Coq cic-v1 exporter setup
        required: false
        type: string

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install

      - name: Install Coq toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y coq

      - name: Install Lean toolchain
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain stable
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Optionally install lean4export for Lean CIC
        if: ${{ inputs.enable_lean_cic == 'true' }}
        shell: bash
        run: |
          git clone --depth 1 https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          cd "$RUNNER_TEMP/lean4export"
          lake build
          echo "LEAN_TOOLCHAIN=$(cat lean-toolchain)" >> "$GITHUB_ENV"
          echo "IVUCX_LEAN_EXPORTER_BIN=$RUNNER_TEMP/lean4export/.lake/build/bin/lean4export" >> "$GITHUB_ENV"

      - name: Optionally setup OCaml for MetaRocq
        if: ${{ inputs.enable_coq_cic == 'true' }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.0

      - name: Optionally install MetaRocq for Coq CIC
        if: ${{ inputs.enable_coq_cic == 'true' }}
        shell: bash
        run: |
          opam repo add coq-released https://coq.inria.fr/opam/released
          opam update
          opam install -y coq-metacoq-template.1.3.1+8.18
          eval "$(opam env)"
          echo "$(opam var bin)" >> "$GITHUB_PATH"

      - name: Show runtime versions
        shell: bash
        run: |
          node --version
          coqc --version
          lean --version || true

      - name: Execute helper plan
        env:
          PLAN_ID: ${{ inputs.plan_id }}
          HELPER_JOB_ID: ${{ inputs.helper_job_id }}
          OPERATION: ${{ inputs.operation }}
          HELPER_BASE_URL: ${{ inputs.helper_base_url }}
          HELPER_ACCESS_TOKEN: ${{ inputs.helper_access_token }}
          REQUEST_ID: ${{ inputs.request_id }}
          HELPER_API_KEY: ${{ secrets.HELPER_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_EXECUTION_ENABLE_LEAN_CIC: ${{ inputs.enable_lean_cic }}
          GITHUB_EXECUTION_ENABLE_COQ_CIC: ${{ inputs.enable_coq_cic }}
          LEAN_CMD: lean
          COQ_CMD: coqc
          IVUCX_COQ_CMD: coqc
        run: node scripts/github-execution-worker.mjs
